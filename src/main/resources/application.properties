spring.application.name=FrameShelf-Backend
# OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL}/api/v1/auth/login/oauth2/callback/google
# Database
jakarta.persistence.jdbc.url=${DB_URL}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
# The Movie Database read key
tmdb.api.read-key=${TMDB_API_READ_KEY}
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=2592000000
# Session Configuration (Not used with JWT, but keeping for compatibility)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
# General
app.frontend.url=${FRONTEND_URL}
app.backend.url=${BACKEND_URL}
# Debugging
# logging.level.org.springframework.security=trace
app.debug=${DEBUG}
